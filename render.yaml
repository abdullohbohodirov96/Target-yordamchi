services:
  - type: web
    name: target-crm
    # 2026-08, foydalanuvchi ANIQ so'ragan: `runtime: python` (native
    # buildpack) ffmpeg/ffprobe'ni O'RNATA OLMAYDI (apt-get yo'q) --
    # audio metadata + stereo-kanal ajratish uchun bular ENDI HAQIQATDA
    # kerak, shuning uchun `runtime: docker`ga o'tkazildi (repo ildizidagi
    # `Dockerfile` orqali, u ffmpeg'ni o'rnatadi). `dockerCommand` --workers
    # 1'ni SAQLAYDI (APScheduler/Telegram holati bitta jarayonda bo'lishi
    # SHART -- ko'proq worker vazifalarni takrorlab yuborardi).
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: gunicorn wsgi:application --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    plan: starter
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_AGENTS_GROUP_ID
        sync: false
      - key: TELEGRAM_REPORT_GROUP_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      # 2026-08: qo'ng'iroq-tahlil (call_analysis.py) ENDI shu o'zgaruvchini
      # o'qiydi -- `OPENAI_MODEL`ga BOG'LIQ EMAS (foydalanuvchi ANIQ
      # so'ragan: "boshqa xususiyatlar OPENAI_MODEL orqali sozlanaversin,
      # lekin qo'ng'iroq tahlili buni yashirincha ISHLATMASIN"). ESLATMA:
      # foydalanuvchi so'ragan "gpt-5.6-terra" HAQIQIY OpenAI modeli EMAS
      # (bunday model hozircha mavjud emas) -- shuning uchun standart
      # qiymat sifatida TASDIQLANGAN, ishlaydigan model qo'yildi. Agar/
      # qachon "gpt-5.6-terra" (yoki boshqa yangi model) HAQIQATDA mavjud
      # bo'lsa, shu qatorni Render Dashboard'da o'zgartirish YETARLI --
      # kodni qayta yozish shart emas.
      - key: OPENAI_ANALYSIS_MODEL
        value: gpt-4o-mini
      - key: META_ACCESS_TOKEN
        sync: false
      - key: META_AD_ACCOUNT_ID
        sync: false
      - key: META_PAGE_ID
        sync: false
      - key: CRON_SECRET
        generateValue: true
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: TIMEZONE
        value: Asia/Tashkent
      - key: DATABASE_URL
        fromDatabase:
          name: target-crm-db
          property: connectionString

databases:
  - name: target-crm-db
    plan: starter
