{% extends "base.html" %}
{% block title %}{{ t('leads_import.title') }} — Replix{% endblock %}
{% block content %}
<a href="{{ url_for('leads_list') }}" class="back-link">{{ t('lead_detail.back') }}</a>
<h1>{{ t('leads_import.h1') }}</h1>
<p class="page-subtitle">{{ t('leads_import.subtitle') }}</p>

<div class="card" style="max-width:480px">
  <form method="post" enctype="multipart/form-data">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field">
      <label>{{ t('leads_import.file') }}</label>
      <input type="file" name="file" accept=".xlsx,.xlsm,.csv" required>
    </div>
    <p class="text-faint" style="margin:0 0 16px; font-size:12.5px">
      {{ t('leads_import.help')|safe }}
    </p>
    <button type="submit" class="block">{{ t('leads_import.submit') }}</button>
  </form>
</div>
{% endblock %}
