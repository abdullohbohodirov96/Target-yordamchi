{% extends "base.html" %}
{% block title %}{{ t('individual_check_upload.title') }} — Replix{% endblock %}
{% block content %}

<a href="{{ url_for('individual_check') }}" class="back-link">{{ t('individual_check_upload.back_link') }}</a>
<h1>{{ t('individual_check_upload.h1') }}</h1>
<p class="page-subtitle">
  {{ t('individual_check_upload.subtitle') }}
</p>

<div class="card" style="max-width:480px">
  <form method="post" enctype="multipart/form-data">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field">
      <label>{{ t('individual_check_upload.field_audio') }}</label>
      <input type="file" name="audio_file" accept="audio/*,.mp3,.wav,.ogg,.oga,.m4a,.mp4,.webm" required autofocus>
    </div>
    <div class="field">
      <label>{{ t('individual_check_upload.field_phone') }}</label>
      <input type="text" name="phone_number" placeholder="+998...">
    </div>
    <div class="field">
      <label>{{ t('individual_check_upload.field_manager') }}</label>
      <select name="manager_id">
        <option value="">{{ t('individual_check_upload.opt_not_selected') }}</option>
        {% for m in managers %}
        <option value="{{ m.id }}">{{ m.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="field">
      <label>{{ t('individual_check_upload.field_direction') }}</label>
      <select name="direction">
        <option value="">{{ t('individual_check_upload.opt_unknown') }}</option>
        <option value="incoming">{{ t('individual_check_upload.opt_incoming') }}</option>
        <option value="outgoing">{{ t('individual_check_upload.opt_outgoing') }}</option>
      </select>
    </div>
    <button type="submit" class="block">{{ t('individual_check_upload.submit') }}</button>
  </form>
</div>

{% endblock %}
