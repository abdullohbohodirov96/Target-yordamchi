{% extends "base.html" %}
{% block title %}{{ m.username }} — {{ t('manager_edit.title') }} — Replix{% endblock %}
{% block content %}
<a href="{{ url_for('managers') }}" class="back-link">{{ t('manager_edit.back') }}</a>
<h1>{{ m.full_name or m.username }}</h1>
<p class="page-subtitle">{{ t('manager_edit.subtitle') }}</p>

<div class="card" style="max-width:420px">
  <form method="post">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field">
      <label>{{ t('managers.username') }}</label>
      <input type="text" name="username" value="{{ m.username }}" required>
    </div>
    <div class="field">
      <label>{{ t('managers.full_name') }}</label>
      <input type="text" name="full_name" value="{{ m.full_name or '' }}">
    </div>
    <div class="field">
      <label>{{ t('managers.phone_optional') }}</label>
      <input type="text" name="phone_number" value="{{ m.phone_number or '' }}" placeholder="+998901234567">
    </div>
    <div class="field">
      <label>{{ t('managers.moizvonki') }}</label>
      <input type="text" name="moizvonki_login" value="{{ m.moizvonki_login or '' }}" placeholder="{{ t('managers.moizvonki_placeholder') }}">
    </div>
    <div class="field">
      <label>{{ t('managers.telegram_id') }}</label>
      <input type="text" name="telegram_user_id" value="{{ m.telegram_user_id or '' }}" placeholder="{{ t('managers.telegram_placeholder') }}">
    </div>
    <div class="field">
      <label>{{ t('managers.hire_date') }}</label>
      <input type="date" name="hire_date" value="{{ m.hire_date.strftime('%Y-%m-%d') if m.hire_date else '' }}">
    </div>
    <div class="field">
      <label>{{ t('managers.role') }}</label>
      <select name="role">
        <option value="manager" {{ 'selected' if m.role=='manager' }}>{{ t('managers.role_manager') }}</option>
        <option value="admin" {{ 'selected' if m.role=='admin' }}>{{ t('managers.role_admin') }}</option>
      </select>
    </div>
    <div class="field">
      <label>{{ t('manager_edit.new_password') }}</label>
      <input type="password" name="password" placeholder="{{ t('manager_edit.new_password_placeholder') }}">
    </div>
    <div class="field">
      <label>{{ t('managers.modules') }}</label>
      {% for key, label in modules %}
      <div style="display:flex; align-items:center; gap:8px; margin-bottom:6px">
        <input type="checkbox" name="allowed_modules" value="{{ key }}" id="mod_{{ key }}" style="width:auto" {{ 'checked' if key in m.allowed_modules }}>
        <label for="mod_{{ key }}" style="margin:0; font-weight:400">{{ label }}</label>
      </div>
      {% endfor %}
    </div>
    <div class="field" style="display:flex; align-items:center; gap:8px">
      <input type="checkbox" name="is_active" id="is_active" style="width:auto" {{ 'checked' if m.is_active }}>
      <label for="is_active" style="margin:0">{{ t('manager_edit.active') }}</label>
    </div>
    <button type="submit" class="block">{{ t('common.save') }}</button>
  </form>
</div>
{% endblock %}
